<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Maintenance Notes – PiP</title>
  <style>
    :root { color-scheme: light; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 24px; color: #1f2937; }
    h1 { margin: 0 0 18px; font-size: 1.25rem; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 12px 0; }
    label { font-weight: 600; }
    input[type="email"] { min-width: 280px; padding: 8px 10px; border-radius: 8px; font: inherit; }
    .btn { padding: 8px 12px; border: 1px solid #c8cdd4; border-radius: 8px; background: #f7f8fa; color: inherit; font: inherit; cursor: pointer; }
    .btn:disabled { cursor: not-allowed; opacity: .55; }
    .muted { color: #667085; font-size: 12px; }
    .status { min-height: 1.25em; }
    .ok { color: #087443; }
    .err { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <h1>Maintenance Notes – Picture-in-Picture</h1>
    <div class="row">
      <label for="email">Your work email:</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@company.com">
      <button class="btn" id="saveEmail" type="button">Save email</button>
    </div>
    <div class="muted">Saved locally in this browser so each submission is tagged with you.</div>
    <div class="row">
      <button class="btn" id="open" type="button" disabled>Open PiP</button>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </div>
  </main>

  <script>
  (() => {
    // Keep the existing deployment endpoint. The backend must be deployed before
    // submissions can succeed. Update LOG_URL after the new Work_Log is created.
    const ENDPOINT = 'https://script.google.com/a/macros/flyzipline.com/s/AKfycbyGlhqRheRLiv6Bs_mwGh3tqTCXmqZre8BBj64jfzah5hB7u_0_HxEQrFNDpgKMLecu/exec';
    const LOG_URL = 'https://docs.google.com/spreadsheets/d/1BqsZaYJZdaaiwQZV9yx5zqtk45jYxl1R1-0V8166_J8/edit';
    const EMAIL_KEY = 'mn_email';
    const LAST_CATEGORY_PREFIX = 'mn_last_category:'; const SHIFT_ENDED_CATEGORY = 'SHIFT ENDED';
    const CATEGORIES = [
      'Productive wrench time',
      'Zip Retrieval / Preparation',
      'Pack up/Driving between sites',
      'No maintenance work available at site', 'Break'
    ];

    const emailInput = document.getElementById('email');
    const saveEmailButton = document.getElementById('saveEmail');
    const openButton = document.getElementById('open');
    const status = document.getElementById('status');
    emailInput.value = localStorage.getItem(EMAIL_KEY) || '';
    openButton.disabled = !emailInput.value.trim();

    saveEmailButton.addEventListener('click', () => {
      const email = emailInput.value.trim();
      if (!email || !emailInput.checkValidity()) {
        status.className = 'status err';
        status.textContent = 'Please enter a valid work email.';
        emailInput.focus();
        return;
      }
      localStorage.setItem(EMAIL_KEY, email);
      openButton.disabled = false;
      status.className = 'status ok';
      status.textContent = 'Email saved.';
    });

    openButton.addEventListener('click', async () => {
      const email = (localStorage.getItem(EMAIL_KEY) || '').trim();
      if (!email) {
        status.className = 'status err';
        status.textContent = 'Save your work email first.';
        return;
      }
      if (!('documentPictureInPicture' in window)) {
        status.className = 'status err';
        status.textContent = 'This browser does not support Picture-in-Picture.';
        return;
      }

      try {
        const pip = await documentPictureInPicture.requestWindow({ width: 390, height: 360 });
        pip.document.body.innerHTML = `
          <style>
            :root { color-scheme: light; font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
            body { margin: 10px; color: #1f2937; }
            .title { margin: 0 0 10px; font-size: 15px; font-weight: 750; }
            label { display: block; margin: 0 0 4px; font-weight: 650; }
            select, input[type="text"] { box-sizing: border-box; width: 100%; padding: 7px 8px; border: 1px solid #b9c0c9; border-radius: 7px; background: white; color: inherit; font: inherit; }
            select { margin-bottom: 8px; }
            input[type="text"] { margin-bottom: 8px; }
            .save { width: 100%; padding: 7px 10px; border: 1px solid #98a2b3; border-radius: 7px; background: #e9eef5; color: #101828; font: inherit; font-weight: 700; cursor: pointer; }
            .save:disabled { cursor: wait; opacity: .6; }
            .status { min-height: 16px; margin-top: 5px; font-size: 12px; }
            .error { color: #b42318; }
            .success { color: #087443; }
            .recent { margin-top: 5px; padding-top: 5px; border-top: 1px solid #e4e7ec; }
            .recent-category { font-size: 12px; font-weight: 650; }
            .recent-age { margin-top: 2px; color: #667085; font-size: 11px; }
            .footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12px; } .end-shift { flex: 0 0 auto; padding: 5px 9px; border: 1px solid #b42318; border-radius: 6px; background: white; color: #b42318; font: inherit; font-weight: 650; cursor: pointer; } .end-shift:disabled { border-color: #d0d5dd; background: #eaecf0; color: #667085; cursor: not-allowed; }
            a { color: #175cd3; text-decoration: none; }
            a:hover { text-decoration: underline; }
            form, iframe { position: absolute; left: -10000px; width: 1px; height: 1px; border: 0; }
          </style>
          <div class="title">Maintenance Notes</div>
          <label for="category">Work Category</label>
          <select id="category" required>
            <option value="" selected disabled>Select work category</option>
            ${CATEGORIES.map(category => `<option value="${category}">${category}</option>`).join('')}
          </select>
          <input id="note" type="text" placeholder="Optional note/context here" autocomplete="off">
          <button id="save" class="save" type="button">Save</button>
          <div id="pipStatus" class="status" role="status" aria-live="polite"></div>
          <div class="recent" aria-live="polite">
            <div id="recentCategory" class="recent-category">Last selected: none recorded on this browser</div>
            <div id="recentAge" class="recent-age"></div>
          </div>
          <div class="footer"><a href="${LOG_URL}" target="_blank" rel="noopener">Google Sheet Log</a><button id="endShift" class="end-shift" type="button" disabled>End Shift</button></div>
          <iframe id="responseFrame" name="maintenanceWorkLogResponse" title="Submission response"></iframe>
          <form id="submitForm" method="post" target="maintenanceWorkLogResponse" action="${ENDPOINT}">
            <input name="email" type="hidden">
            <input name="category" type="hidden">
            <input name="note" type="hidden">
            <input name="submissionId" type="hidden">
          </form>
        `;

        const doc = pip.document;
        const categoryInput = doc.getElementById('category');
        const noteInput = doc.getElementById('note');
        const saveButton = doc.getElementById('save'); const endShiftButton = doc.getElementById('endShift'); const endShiftButton = doc.getElementById('endShift');
        const pipStatus = doc.getElementById('pipStatus');
        const recentCategory = doc.getElementById('recentCategory');
        const recentAge = doc.getElementById('recentAge');
        const form = doc.getElementById('submitForm');
        const responseFrame = doc.getElementById('responseFrame');
        const lastCategoryStorageKey = emailValue => `${LAST_CATEGORY_PREFIX}${emailValue.trim().toLowerCase()}`;
        let activeEmail = email;
        let pendingKey = '';
        let pendingId = '';
        let pendingValues = null;
        let timer = null;
        let ageTimer = null; let latestCategoryRequestId = ''; let latestStatusKnown = false; let submissionInProgress = false; let latestCategoryRequestId = ''; let latestStatusKnown = false; let submissionInProgress = false;

        function setStatus(message, kind = '') {
          pipStatus.textContent = message;
          pipStatus.className = `status ${kind}`;
        }

        function updateEndShiftAvailability() { saveButton.disabled = submissionInProgress; endShiftButton.disabled = submissionInProgress || !latestStatusKnown || !lastCategoryRecord || !CATEGORIES.includes(lastCategoryRecord.category); } function updateEndShiftAvailability() { saveButton.disabled = submissionInProgress; endShiftButton.disabled = submissionInProgress || !latestStatusKnown || !lastCategoryRecord || !CATEGORIES.includes(lastCategoryRecord.category); } function renderLastCategory(record, emptyLabel = 'Last selected: none recorded on this browser') {
          clearTimeout(ageTimer);
          const savedAt = Number(record && record.savedAt);
          if (!record || (!CATEGORIES.includes(record.category) && record.category !== SHIFT_ENDED_CATEGORY) || !Number.isFinite(savedAt) || savedAt <= 0) {
            recentCategory.textContent = emptyLabel;
            recentAge.textContent = ''; updateEndShiftAvailability(); updateEndShiftAvailability();
            return;
          }

          recentCategory.textContent = `Last selected: ${record.category}`;
          const centralTime = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/Chicago',
            month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
          }).format(new Date(savedAt));

          function updateAge() {
            const elapsed = Math.max(0, Date.now() - savedAt);
            const minutes = Math.floor(elapsed / 60000);
            const relative = minutes === 0 ? 'less than 1 min ago' : `${minutes} min ago`;
            recentAge.textContent = `${relative} · ${centralTime}`;
            ageTimer = setTimeout(updateAge, 60000 - (elapsed % 60000) + 20);
          }

          updateAge(); updateEndShiftAvailability(); updateEndShiftAvailability();
        }

        let lastCategoryRecord = null;
        try {
          lastCategoryRecord = JSON.parse(localStorage.getItem(lastCategoryStorageKey(activeEmail)) || 'null');
        } catch (_) {
          lastCategoryRecord = null;
        }
        renderLastCategory(lastCategoryRecord);

        function loadLatestCategory(emailValue) { latestStatusKnown = false; updateEndShiftAvailability(); latestCategoryRequestId = `latest-${crypto.randomUUID()}`; responseFrame.src = `${ENDPOINT}?action=latestCategory&email=${encodeURIComponent(emailValue)}&requestId=${encodeURIComponent(latestCategoryRequestId)}`; }
        pip.addEventListener('message', event => {
          const message = event.data;
          if (!message || message.channel !== 'maintenance-work-log-latest' || message.requestId !== latestCategoryRequestId) return;
          if (!message.success) { latestStatusKnown = false; updateEndShiftAvailability(); latestStatusKnown = false; updateEndShiftAvailability();
            if (!lastCategoryRecord) {
              recentCategory.textContent = 'Could not load the previous category';
              recentAge.textContent = message.error || 'Please try again when you reopen PiP.';
            }
            return;
          }

          lastCategoryRecord = message.record || null; latestStatusKnown = true; latestStatusKnown = true;
          if (lastCategoryRecord) {
            localStorage.setItem(lastCategoryStorageKey(activeEmail), JSON.stringify(lastCategoryRecord));
          }
          renderLastCategory(lastCategoryRecord, 'No previous category recorded for this email');
        });
        loadLatestCategory(email);

        pip.addEventListener('message', event => {
          // Correlate the server acknowledgment with the random submission ID.
          const message = event.data;
          if (!message || message.channel !== 'maintenance-work-log' || message.submissionId !== pendingId) return;
          clearTimeout(timer);
          submissionInProgress = false; updateEndShiftAvailability();
          if (message.success) {
            if (message.category && message.savedAt && pendingValues && (CATEGORIES.includes(message.category) || message.category === SHIFT_ENDED_CATEGORY)) {
              lastCategoryRecord = { category: message.category, savedAt: Number(message.savedAt) };
              localStorage.setItem(lastCategoryStorageKey(pendingValues.email), JSON.stringify(lastCategoryRecord));
              renderLastCategory(lastCategoryRecord);
            }
            categoryInput.value = '';
            noteInput.value = '';
            pendingKey = '';
            pendingId = '';
            pendingValues = null;
            setStatus('Saved ✓', 'success');
          } else {
            setStatus(message.error || 'Could not save. Please try again.', 'error');
          }
        });

        function submit(categoryOverride = '') { if (submissionInProgress) return; const category = categoryOverride || categoryInput.value; if (categoryOverride === SHIFT_ENDED_CATEGORY && (!latestStatusKnown || !lastCategoryRecord || !CATEGORIES.includes(lastCategoryRecord.category) || activeEmail.toLowerCase() !== (localStorage.getItem(EMAIL_KEY) || '').trim().toLowerCase())) { setStatus('End Shift is available after a work category has been saved for this email.', 'error'); return; }
          if (saveButton.disabled) return;
          if (!categoryOverride && !CATEGORIES.includes(category)) {
            setStatus('Please select a work category.', 'error');
            categoryInput.focus();
            return;
          }

          const emailValue = (localStorage.getItem(EMAIL_KEY) || '').trim();
          if (!emailValue) {
            setStatus('Save your work email on the launcher, then reopen PiP.', 'error');
            return;
          }

          if (emailValue.toLowerCase() !== activeEmail.toLowerCase()) {
            activeEmail = emailValue;
            try {
              lastCategoryRecord = JSON.parse(localStorage.getItem(lastCategoryStorageKey(activeEmail)) || 'null');
            } catch (_) {
              lastCategoryRecord = null;
            }
            renderLastCategory(lastCategoryRecord);
          }

          const values = { email: emailValue, category: category, note: categoryOverride ? '' : noteInput.value };
          const key = JSON.stringify(values);
          if (key !== pendingKey) {
            pendingKey = key;
            pendingId = `mn-${Date.now().toString(36)}-${crypto.randomUUID()}`;
          }
          pendingValues = values;

          form.elements.email.value = values.email;
          form.elements.category.value = values.category; latestCategoryRequestId = ''; submissionInProgress = true; updateEndShiftAvailability();
          form.elements.note.value = values.note;
          form.elements.submissionId.value = pendingId;
          submissionInProgress = true; updateEndShiftAvailability();
          setStatus('Saving…');
          timer = setTimeout(() => {
            submissionInProgress = false; updateEndShiftAvailability();
            setStatus('No confirmation received. Your entry is still here; click Save to retry.', 'error');
          }, 20000);
          form.submit();
        }

        saveButton.addEventListener('click', () => submit()); endShiftButton.addEventListener('click', () => submit(SHIFT_ENDED_CATEGORY));
        noteInput.addEventListener('keydown', event => {
          if (event.key === 'Enter') {
            event.preventDefault();
            submit();
          }
        });
        noteInput.focus();
        status.className = 'status ok';
        status.textContent = 'PiP opened.';
      } catch (error) {
        status.className = 'status err';
        status.textContent = `PiP failed: ${error && error.message ? error.message : error}`;
      }
    });
  })();
  </script>
</body>
</html>
